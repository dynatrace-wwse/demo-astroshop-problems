manifestVersion: "1.0"

projects:
  - name: init_configs
    path: init_configs

environmentGroups:
  - name: core
    environments:
      - name: core-environment
        url:
          type: environment
          value: DT_PLATFORM_TENANT_URL
        auth:
          token:
            name: DT_API_TOKEN
          platformToken:
            name: DT_PLATFORM_TOKEN
